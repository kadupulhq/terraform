version: 2
updates:
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-terraform:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directory: /stacks/weblate
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      weblate-terraform:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
