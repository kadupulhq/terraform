name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - run: terraform fmt -check -recursive -diff

      # No credentials needed: this checks the configuration, not the account.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform -chdir=stacks/weblate init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=stacks/weblate validate
      - run: node --test stacks/weblate/tests/backup.test.mjs
      - name: Validate deployment configuration
        working-directory: stacks/weblate/deployment
        run: |
          sh -n backup-database.sh
          shellcheck backup-database.sh
          docker-compose --env-file .env.example config --quiet
          docker-compose --env-file .env.example -f compose.yaml -f compose.bootstrap.yaml config --quiet
          docker-compose --env-file .env.example -f compose.yaml -f compose.smtp.yaml config --quiet

  plan:
    name: Plan
    needs: check
    runs-on: ubuntu-latest
    # A plan reads the whole organisation, so it runs with a real token and only
    # for a branch in this repository, never a pull request from a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: github-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan
        # Apply is deliberately not wired up. Changing who can merge to main
        # across the organisation is a decision, not a side effect of a merge.
        # Run `terraform apply tfplan` by hand after reading the plan.
